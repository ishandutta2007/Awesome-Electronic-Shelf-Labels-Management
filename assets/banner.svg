<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 700; font-size: 14px; fill: #06b6d4; }
    .label-price { font-family: 'Courier New', monospace; font-weight: 700; font-size: 26px; fill: #0f172a; }
    .label-sku { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 600; font-size: 12px; fill: #64748b; }
    
    /* Dynamic Pulse Animations */
    @keyframes signalPulse {
      0% { opacity: 0.2; transform: scale(0.95); }
      50% { opacity: 0.9; transform: scale(1.05); filter: drop-shadow(0 0 8px #06b6d4); }
      100% { opacity: 0.2; transform: scale(0.95); }
    }
    
    @keyframes priceChange {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes priceChangeAlt {
      0%, 45% { opacity: 0; }
      50%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes floatTag {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .wave1 { animation: signalPulse 3s infinite ease-in-out; transform-origin: 180px 150px; }
    .wave2 { animation: signalPulse 3s infinite ease-in-out 1s; transform-origin: 180px 150px; }
    .wave3 { animation: signalPulse 3s infinite ease-in-out 2s; transform-origin: 180px 150px; }
    .floating-tag { animation: floatTag 5s infinite ease-in-out; }
    .p-old { animation: priceChange 6s infinite; }
    .p-new { animation: priceChangeAlt 6s infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid Background -->
  <g opacity="0.08">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V300 M200 0V300 M300 0V300 M400 0V300 M500 0V300 M600 0V300 M700 0V300 M800 0V300 M900 0V300 M1000 0V300 M1100 0V300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Wireless Signal Waves -->
  <g class="wave3">
    <circle cx="180" cy="150" r="110" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  </g>
  <g class="wave2">
    <circle cx="180" cy="150" r="80" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.6"/>
  </g>
  <g class="wave1">
    <circle cx="180" cy="150" r="50" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Central Access Point Hub Icon -->
  <circle cx="180" cy="150" r="24" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <path d="M172 150L180 142L188 150 M180 143V158" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Electronic Shelf Label Illustration -->
  <g class="floating-tag" transform="translate(900, 55)">
    <rect width="220" height="190" rx="14" fill="url(#tagGrad)" stroke="#cbd5e1" stroke-width="4" filter="url(#glow)"/>
    <path d="M 0 14 Q 0 0 14 0 L 206 0 Q 220 0 220 14 L 220 35 L 0 35 Z" fill="#ef4444"/>
    <text x="110" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPECIAL OFFER</text>
    <rect x="12" y="45" width="196" height="130" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="24" y="68" class="label-sku">SKU #884-ESL • E-INK 2.9"</text>
    <text x="24" y="86" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#1e293b">Smart Wireless Tag</text>

    <!-- Dynamic Animated Price -->
    <g class="p-old">
      <text x="24" y="125" class="label-price">$14.99</text>
    </g>
    <g class="p-new">
      <text x="24" y="125" class="label-price" fill="#dc2626">$9.99</text>
      <rect x="130" y="105" width="65" height="22" rx="4" fill="#dcfce7"/>
      <text x="162" y="120" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#15803d" text-anchor="middle">SAVE 33%</text>
    </g>

    <!-- Simulated Barcode -->
    <g transform="translate(24, 140)">
      <rect x="0" y="0" width="3" height="22" fill="#0f172a"/>
      <rect x="5" y="0" width="1" height="22" fill="#0f172a"/>
      <rect x="8" y="0" width="4" height="22" fill="#0f172a"/>
      <rect x="14" y="0" width="2" height="22" fill="#0f172a"/>
      <rect x="18" y="0" width="1" height="22" fill="#0f172a"/>
      <rect x="21" y="0" width="3" height="22" fill="#0f172a"/>
      <rect x="26" y="0" width="5" height="22" fill="#0f172a"/>
      <rect x="33" y="0" width="2" height="22" fill="#0f172a"/>
      <rect x="37" y="0" width="1" height="22" fill="#0f172a"/>
      <rect x="40" y="0" width="4" height="22" fill="#0f172a"/>
      <rect x="46" y="0" width="2" height="22" fill="#0f172a"/>
      <rect x="50" y="0" width="3" height="22" fill="#0f172a"/>
      <rect x="55" y="0" width="1" height="22" fill="#0f172a"/>
      <rect x="58" y="0" width="4" height="22" fill="#0f172a"/>
      <rect x="64" y="0" width="2" height="22" fill="#0f172a"/>
    </g>
    <circle cx="185" cy="152" r="5" fill="#22c55e" filter="url(#glow)"/>
  </g>

  <!-- Central Header Text -->
  <g transform="translate(320, 110)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="19" class="badge-text">ELECTRONIC SHELF LABELS (ESL)</text>
    <text x="0" y="75" class="title">Awesome ESL Management</text>
    <text x="0" y="112" class="subtitle">Curated SaaS Platforms, Dynamic Pricing &amp; Open-Source IoT Hardware</text>
  </g>
</svg>
